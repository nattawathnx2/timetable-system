<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/group.css">
    <title>AI Timetable</title>
</head>
<body>
    <div class="container py-4">
        <a href="dashboard.html" class="text-decoration-none text-secondary">&larr; Back to Dashboard</a>
        <h2 class="fw-bold mt-3 mb-1">Manage Student-Group</h2>

        <div class="card shadow-sm border-0 mb-1">
            <div class="card-body p-4">
                <h5 class="fw-semibold mb-3">Student-Group Information</h5>
                
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="groupCode" class="form-label">Group Code</label>
                        <input type="text" id="groupCode" class="form-control" placeholder="Groups Code">
                    </div>
                    <div class="col-md-6">
                        <label for="groupName" class="form-label">Group Name</label>
                        <input type="text" id="groupName" class="form-control" placeholder="Groups Name">
                    </div>
                    <div class="col-md-6">
                        <label for="academicYears" class="form-label">Years</label>
                        <input type="text" id="academicYears" class="form-control" placeholder="Academic Years">
                    </div>
                    <div class="col-md-6">
                        <label for="studentConst" class="form-label">Count</label>
                        <input type="text" id="studentConst" class="form-control" placeholder="Student Count">
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-2 mt-3">
                    <button id="addGroups" class="btn btn-primary">Add Groups</button>
                    <button id="updateGroups" class="btn btn-success">Update Groups</button>
                    <button id="loadGroups" class="btn btn-outline-secondary">Load Groups</button>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Group ID</th>
                                <th>Group Code</th>
                                <th>Group Name</th>
                                <th>Academic Years</th>
                                <th>Const</th>
                                <th>Action</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="output"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/auth-admin.js"></script>
    <script src="js/student-group.js"></script>
</body>
</html>
