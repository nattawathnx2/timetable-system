<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/schedules.css">
    <title>AI Timetable</title>
</head>
<body>
    <div class="container py-4">
        <a href="dashboard.html" class="text-decoration-none text-secondary">&larr; Back to Dashboard</a>
        <h2 class="fw-bold mt-3 mb-1">Manage Schedules</h2>

        <div class="card shadow-sm border-0 mb-1">
            <div class="crad-body p-4">
                <h5 class="fw-semibold mb-3">Schedule Information</h5>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="teacherSelect" class="form-label">Teacher Select</label>
                        <select id="teacherSelect" class="form-select">
                            <option value="">Select Teacher</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="subjectSelect" class="form-label">Subject Select</label>
                        <select id="subjectSelect" class="form-select">
                            <option value="">Select Subject</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="roomSelect" class="form-label">Room Select</label>
                        <select id="roomSelect" class="form-select">
                            <option value="">Select Room</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="groupSelect" class="form-label">Group Select</label>
                        <select id="groupSelect" class="form-select">
                            <option value="">Select Group</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="startTime" class="form-label">Start Time</label>
                        <input type="time" id="startTime" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label for="endTime" class="form-label">End Time</label>
                        <input type="time" id="endTime" class="form-control">
                    </div>
                    <div class="col-md-12">
                        <label for="dayOfWeek" class="form-label">Day Select</label>
                        <select id="dayOfWeek" class="form-select">
                            <option value="">Select Day</option>
                            <option value="Monday">Moaday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-2 mt-3">
                    <button id="addSchedules" class="btn btn-primary">Add Schedule</button>
                    <button id="updateSchedules" class="btn btn-success">Update Schedule</button>
                    <button id="loadSchedules" class="btn btn-outline-secondary">Load Schedule</button>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Day</th>
                                <th>Start</th>
                                <th>End</th>
                                <th>Teacher</th>
                                <th>Subject</th>
                                <th>Room</th>
                                <th>Group</th>
                                <th>Action</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="output"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth-admin.js"></script>
    <script src="js/schedules.js"></script>
</body>
</html>
