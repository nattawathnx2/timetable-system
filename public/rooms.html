<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/room.css">
    <title>AI Timetable</title>
</head>
<body>
    <div class="container py-4">
        <a href="dashboard.html" class="text-decoration-none text-secondary">&larr; Back to Dashboard</a>
        <h2 class="fw-bold mt-3 mb-1">Manage Rooms</h2>

        <div class="card shadow-sm border-0 mb-1">
            <div class="card-body p-4">
                <h5 class="fw-semibold mb-3">Rooms Information</h5>

                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="roomCode" class="form-label">Room Code</label>
                        <input type="text" id="roomCode" class="form-control" placeholder="Rooms Code">
                    </div>
                    <div class="col-md-4">
                        <label for="roomName" class="form-label">Room Name</label>
                        <input type="text" id="roomName" class="form-control" placeholder="Rooms Name">
                    </div>
                    <div class="col-md-4">
                        <label for="roomType" class="form-label">Room Type</label>
                        <input type="text" id="roomType" class="form-control" placeholder="Rooms Type">
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-2 mt-3">
                    <button id="addRooms" class="btn btn-primary">Add Rooms</button>
                    <button id="updateRooms" class="btn btn-success">Update Rooms</button>
                    <button id="loadRooms" class="btn btn-outline-secondary">Load Rooms</button>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Rooms ID</th>
                                <th>Rooms Code</th>
                                <th>Rooms Name</th>
                                <th>Rooms Type</th>
                                <th>Action</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="output"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/auth-admin.js"></script>
    <script src="js/room.js"></script>
</body>
</html>
