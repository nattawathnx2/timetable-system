<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/subject.css">
    <title>AI Timetable</title>
</head>
<body>
    <div class="container py-4">
        <a href="dashboard.html" class="text-decoration-none text-secondary">&larr; Back to Dashboard</a>
        <h2 class="fw-bold mt-3 mb-1">Manage Subjects</h2>

        <div class="card shadow-sm border-0 mb-1">
            <div class="card-body p-4">
                <h5 class="fw-semibold mb-3">Subject Information</h5>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="subjectCode" class="form-label">Subject Code</label>
                        <input type="text" id="subjectCode" class="form-control" placeholder="Subject Code">
                    </div>
                    <div class="col-md-6">
                        <label for="subjectName" class="form-label">Subject Name</label>
                        <input type="text" id="subjectName" class="form-control" placeholder="Subject Name">
                    </div>
                    <div class="col-md-6">
                        <label for="credits" class="form-label">Credits</label>
                        <input type="text" id="credits" class="form-control" placeholder="Credits">
                    </div>
                    <div class="col-md-6">
                        <label for="hours" class="form-label">Hours</label>
                        <input type="text" id="hours" class="form-control" placeholder="Hours Per Week">
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-2 mt-3">
                    <button id="addSubjects" class="btn btn-primary">Add Subjects</button>
                    <button id="updateSubjects" class="btn btn-success">Update Subjects</button>
                    <button id="loadSubjects" class="btn btn-outline-secondary">Load Subjects</button>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Subject ID</th>
                                <th>Subject Code</th>
                                <th>Subject Name</th>
                                <th>Credits</th>
                                <th>Hours Per Week</th>
                                <th>Action</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="output"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth-admin.js"></script>
    <script src="js/subject.js"></script>
</body>
</html>
