<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Timetable</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/user.css">
</head>
<body>
    <div class="container py-4">
        <a href="dashboard.html" class="text-decoration-none text-secondary">&larr; Back to Dashboard</a>
        <h2 class="fw-bold mt-3 mb-1">Manage Users</h2>
    

        <div class="card shadow-sm border-0 mb-1">
            <div class="card-body p-4">
                <h5 class="fw-semibold mb-3">User Information</h5>

                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Enter Username">
                    </div>
                    <div class="col-md-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Password">
                    </div>
                    <div class="col-md-4">
                        <label for="role" class="form-label">Role</label>
                        <select id="role" class="form-select">
                            <option value="">Select Role</option>
                            <option value="admin">Admin</option>
                            <option value="teacher">Teacher</option>
                            <option value="student">Student</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-2 mt-3">
                    <button id="addUsers" class="btn btn-primary">Add Users</button>
                    <button id="updateUsers" class="btn btn-success">Update Users</button>
                    <button id="loadUsers" class="btn btn-outline-secondary">Load Users</button>
                </div>

            </div>
        </div>

        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Users ID</th>
                                <th>Username</th>
                                <th>Role</th>
                                <th>Create At</th>
                                <th>Action</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="output"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth-admin.js"></script>
    <script src="js/user.js"></script>
</body>
</html>
