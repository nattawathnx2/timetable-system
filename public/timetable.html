<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/timetable.css">
    <title>AI TimeTable</title>
</head>
<body>
    <div class="container py-4">
        <a href="dashboard.html" class="text-decoration-none text-secondary">&larr; Back to Dashboard</a>
        <h2 class="fw-bold mt-3 mb-1">TimeTable View</h2>

        <div class="card shadow-sm border-0 mb-1">
            <div class="card-body p-4">
                <h5 class="fw-semibold mb-3">Timetable Information</h5>

                <div class="row g-3">
                    <div class="col-md-6" id="teacherFilter">
                        <label for="teacherSelect" class="form-label">Teacher Select</label>
                        <select id="teacherSelect" class="form-select">
                            <option value="">Select Teacher</option>
                        </select>
                    </div>
                    <div class="col-md-6" id="subjectFilter">
                        <label for="subjectSelect" class="form-label">Subject Select</label>
                        <select id="subjectSelect" class="form-select">
                            <option value="">Select Subject</option>
                        </select>
                    </div>
                    <div class="col-md-6" id="roomFilter">
                        <label for="roomSelect" class="form-label">Room Select</label>
                        <select id="roomSelect" class="form-select">
                            <option value="">Select Room</option>
                        </select>
                    </div>
                    <div class="col-md-6" id="groupFilter">
                        <label for="groupSelect" class="form-label">Group Select</label>
                        <select id="groupSelect" class="form-select">
                            <option value="">Select Group</option>
                        </select>
                    </div>
                </div>
                <div class="d-flex flex-wrap gap-2 mt-3">
                    <button id="loadTimetable" class="btn btn-outline-secondary">Load Timetable</button>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 mt-4 timetable-card">
            <div class="card-body p-4">
                <h5 class="fw-semibold mb-3">Weekly Timetable</h5>
                <div id="output"></div>
            </div>
        </div>
    </div>

    <script src="js/timetable.js"></script>
</body>
</html>
